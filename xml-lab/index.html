<!DOCTYPE html>
<html>
<head>
    <title>My Book Catalogue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h1 {
            color: darkblue;
        }
        .book {
            border: 1px solid gray;
            padding: 10px;
            margin-bottom: 10px;
            width: 400px;
        }
    </style>
</head>
<body>

    <h1>Book Catalogue</h1>

    <div id="list"></div>

    <script>
        // get the xml file and show it
        fetch('book.xml')
            .then(function(response) {
                if (!response.ok) {
                    throw new Error('Fetch error: ' + response.status);
                } else {
                    return response.text();
                }
            })
            .then(function(xmlText) {
                // turn the text into an xml document
                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(xmlText, 'text/xml');

                // get all the book elements
                var books = xmlDoc.getElementsByTagName('book');
                var out = '';

                // loop through each book and build the html
                for (var i = 0; i < books.length; i++) {
                    var id = books[i].getAttribute('id');
                    var t = books[i].getElementsByTagName('title')[0].childNodes[0].nodeValue;
                    var a = books[i].getElementsByTagName('author')[0].childNodes[0].nodeValue;
                    var p = books[i].getElementsByTagName('price')[0].childNodes[0].nodeValue;

                    out += '<div class="book">';
                    out += '<p>ID: ' + id + '</p>';
                    out += '<p>Title: ' + t + '</p>';
                    out += '<p>Author: ' + a + '</p>';
                    out += '<p>Price: $' + p + '</p>';
                    out += '</div>';
                }

                document.getElementById('list').innerHTML = out;
            })
            .catch(function(err) {
                console.error('Fetch error: ' + err.message);
            });
    </script>

</body>
</html>
